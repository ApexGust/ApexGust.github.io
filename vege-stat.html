<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔬菜统计服务</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: #f7fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e6fffa;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: #a0aec0;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stats-container {
            display: none;
            margin-top: 30px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .stats-title {
            font-size: 24px;
            color: #2d3748;
            font-weight: 700;
        }

        .stats-header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .total-info {
            font-size: 16px;
            color: #718096;
        }

        .copy-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: #48bb78;
            border-color: #48bb78;
            color: white;
        }

        .stats-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .stats-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stats-table th,
        .stats-table td {
            padding: 16px;
            text-align: left;
        }

        .stats-table th {
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-table tbody tr {
            background: white;
            transition: all 0.2s ease;
        }

        .stats-table tbody tr:nth-child(even) {
            background: #f7fafc;
        }

        .stats-table tbody tr:hover {
            background: #edf2f7;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stats-table td {
            color: #4a5568;
            font-size: 15px;
        }

        .weight-cell {
            font-weight: 600;
            color: #667eea;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
            font-size: 16px;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c53030;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #22543d;
        }

        .file-info {
            display: none;
            background: #e6fffa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #234e52;
            border-left: 4px solid #319795;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .stats-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .stats-header-right {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .copy-btn {
                width: 100%;
                justify-content: center;
            }

            .stats-table {
                font-size: 14px;
            }

            .stats-table th,
            .stats-table td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥬 蔬菜统计服务</h1>
        <p class="subtitle">上传Excel文件，自动统计各品名的总重量</p>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <div class="file-info" id="fileInfo"></div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📊</div>
            <div class="upload-text">点击或拖拽Excel文件到此处</div>
            <div class="upload-hint">支持 .xlsx 和 .xls 格式</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>处理中...</div>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stats-header">
                <div class="stats-title">统计结果</div>
                <div class="stats-header-right">
                    <div class="total-info" id="totalInfo"></div>
                    <button class="copy-btn" id="copyBtn">
                        <span id="copyIcon">📋</span>
                        <span id="copyText">复制结果</span>
                    </button>
                </div>
            </div>
            <table class="stats-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">序号</th>
                        <th>品名</th>
                        <th style="width: 200px;">总重量</th>
                        <th style="width: 150px;">记录数</th>
                    </tr>
                </thead>
                <tbody id="statsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const statsContainer = document.getElementById('statsContainer');
        const statsBody = document.getElementById('statsBody');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const fileInfo = document.getElementById('fileInfo');
        const loading = document.getElementById('loading');
        const totalInfo = document.getElementById('totalInfo');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const copyText = document.getElementById('copyText');

        // 存储当前统计数据
        let currentStats = null;
        let currentUnit = '';

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 复制按钮事件
        copyBtn.addEventListener('click', () => {
            if (!currentStats || currentStats.length === 0) {
                showError('没有可复制的数据');
                return;
            }

            copyResultsToClipboard();
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        function showFileInfo(fileName, rowCount) {
            fileInfo.innerHTML = `📄 <strong>${fileName}</strong> - 共 ${rowCount} 条数据`;
            fileInfo.style.display = 'block';
        }

        function handleFile(file) {
            // 检查文件类型
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                showError('请上传 Excel 文件（.xlsx 或 .xls 格式）');
                return;
            }

            loading.style.display = 'block';
            statsContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 读取第一个工作表
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // 转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    if (jsonData.length < 2) {
                        throw new Error('Excel文件中没有数据');
                    }

                    processData(jsonData, file.name);
                } catch (error) {
                    loading.style.display = 'none';
                    showError('解析Excel文件失败: ' + error.message);
                    console.error(error);
                }
            };

            reader.onerror = () => {
                loading.style.display = 'none';
                showError('读取文件失败');
            };

            reader.readAsArrayBuffer(file);
        }

        function processData(jsonData, fileName) {
            try {
                // 获取表头
                const headers = jsonData[0];
                
                // 查找关键列的索引
                const pinmingIndex = headers.findIndex(h => h && h.toString().includes('品名'));
                const quantityIndex = headers.findIndex(h => h && (h.toString().includes('购买量') || h.toString().includes('重量')));
                const unitIndex = headers.findIndex(h => h && h.toString().includes('计量单位'));

                if (pinmingIndex === -1) {
                    throw new Error('未找到"品名"列，请检查Excel文件格式');
                }

                if (quantityIndex === -1) {
                    throw new Error('未找到"购买量"列，请检查Excel文件格式');
                }

                // 统计数据
                const stats = {};
                let totalRows = 0;
                let unit = '';

                // 从第二行开始处理数据（跳过表头）
                for (let i = 1; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    
                    // 跳过空行
                    if (!row || row.length === 0) continue;

                    const pinming = row[pinmingIndex];
                    const quantity = row[quantityIndex];
                    
                    // 跳过无效数据
                    if (!pinming || quantity === undefined || quantity === null || quantity === '') {
                        continue;
                    }

                    // 获取单位（如果有）
                    if (unitIndex !== -1 && !unit && row[unitIndex]) {
                        unit = row[unitIndex].toString();
                    }

                    // 转换数量为数字
                    let numQuantity = parseFloat(quantity);
                    if (isNaN(numQuantity)) {
                        console.warn(`第 ${i + 1} 行的购买量无法转换为数字: ${quantity}`);
                        continue;
                    }

                    totalRows++;

                    // 统计
                    if (!stats[pinming]) {
                        stats[pinming] = {
                            totalWeight: 0,
                            count: 0
                        };
                    }
                    stats[pinming].totalWeight += numQuantity;
                    stats[pinming].count++;
                }

                if (totalRows === 0) {
                    throw new Error('没有有效的数据行');
                }

                displayStats(stats, unit, totalRows, fileName);
                showSuccess(`✅ 成功处理 ${totalRows} 条记录！`);
                showFileInfo(fileName, totalRows);

            } catch (error) {
                showError('处理数据失败: ' + error.message);
                console.error(error);
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayStats(stats, unit, totalRows, fileName) {
            // 转换为数组并排序（按总重量降序）
            const statsArray = Object.entries(stats).map(([name, data]) => ({
                name,
                totalWeight: data.totalWeight,
                count: data.count
            })).sort((a, b) => b.totalWeight - a.totalWeight);

            // 保存当前统计数据供复制使用
            currentStats = statsArray;
            currentUnit = unit;

            // 清空表格
            statsBody.innerHTML = '';

            // 计算总重量
            const grandTotal = statsArray.reduce((sum, item) => sum + item.totalWeight, 0);

            // 更新总信息
            totalInfo.textContent = `共 ${statsArray.length} 个品名，总计 ${grandTotal.toFixed(2)} ${unit}`;

            // 填充表格
            statsArray.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${item.name}</strong></td>
                    <td class="weight-cell">${item.totalWeight.toFixed(2)} ${unit}</td>
                    <td>${item.count} 条</td>
                `;
                statsBody.appendChild(row);
            });

            // 显示统计容器
            statsContainer.style.display = 'block';
            
            // 平滑滚动到结果
            setTimeout(() => {
                statsContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function copyResultsToClipboard() {
            // 计算总重量
            const grandTotal = currentStats.reduce((sum, item) => sum + item.totalWeight, 0);

            // 创建格式化文本
            let textFormat = '';

            // 标题
            textFormat += '🥬 蔬菜统计结果\n';
            textFormat += '='.repeat(50) + '\n\n';
            textFormat += `共 ${currentStats.length} 个品名，总计 ${grandTotal.toFixed(2)} ${currentUnit}\n\n`;

            // 数据行
            currentStats.forEach((item, index) => {
                textFormat += `${(index + 1).toString().padStart(2, ' ')}. ${item.name.padEnd(20, ' ')} `;
                textFormat += `${item.totalWeight.toFixed(2)} ${currentUnit}`.padEnd(15, ' ');
                textFormat += `(${item.count} 条)\n`;
            });

            // 复制到剪贴板
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textFormat)
                    .then(() => {
                        showCopySuccess();
                    })
                    .catch(err => {
                        fallbackCopy(textFormat);
                    });
            } else {
                fallbackCopy(textFormat);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopySuccess();
                } else {
                    showError('复制失败，请手动复制');
                }
            } catch (err) {
                showError('复制失败: ' + err.message);
            }
            
            document.body.removeChild(textarea);
        }

        function showCopySuccess() {
            copyBtn.classList.add('copied');
            copyIcon.textContent = '✓';
            copyText.textContent = '已复制';
            showSuccess('✅ 统计结果已复制到剪贴板！');

            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyIcon.textContent = '📋';
                copyText.textContent = '复制结果';
            }, 3000);
        }
    </script>
</body>
</html>
